<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - SMART STUDENT VILLA</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --ssv-green-deep: #1F4D2C;
      --ssv-green: #3A7D44;
      --ssv-green-light: #6FA96E;
      --ssv-cream: #F7F5EC;
      --ssv-cream-2: #FBFAF4;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    .font-display {
      font-family: 'Fredoka', 'Poppins', sans-serif;
    }

    .green-text {
      background: linear-gradient(90deg, #2F6B3A, #6FA96E);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .btn-green {
      background: linear-gradient(180deg, #4A8C4F, #2F6B3A);
    }

    .btn-green:hover {
      background: linear-gradient(180deg, #558F58, #356E3B);
    }

    .glass-card {
      background: #FFFFFF;
      border: 1px solid rgba(58, 125, 68, 0.15);
      border-radius: 1.75rem;
    }

    ::selection {
      background: #6FA96E;
      color: #ffffff;
    }
  </style>
</head>
<body class="bg-[#F7F5EC] text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full relative z-10">

    <!-- Decorative background dots -->
    <div class="fixed inset-0 opacity-[0.35] pointer-events-none -z-10"
      style="background-image: radial-gradient(#3A7D44 1px, transparent 1px); background-size: 26px 26px;"></div>

    <!-- Background glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] bg-[#3A7D44]/10 rounded-full blur-[100px] pointer-events-none -z-10"></div>

    <!-- Login Card -->
    <div class="glass-card p-8 sm:p-10 shadow-xl relative">

      <!-- Brand Logo Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl border-2 border-[#2F6B3A] bg-white flex items-center justify-center shadow-sm mx-auto mb-4">
          <i class="bi bi-shield-lock-fill text-[#2F6B3A] text-2xl"></i>
        </div>

        <h1 class="text-2xl font-extrabold font-display tracking-wide text-[#1F4D2C]">SMART STUDENT VILLA</h1>
        <p class="text-xs text-[#4A8C4F] mt-1 uppercase tracking-widest font-semibold">Portal Administrator Presensi</p>
      </div>

      <!-- Login Form -->
      <form onsubmit="handleLogin(event)" class="space-y-5">

        <div id="login-alert" class="hidden p-3.5 rounded-xl bg-rose-50 border border-rose-300 text-rose-600 text-xs font-semibold"></div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="bi bi-person-fill"></i>
            </span>
            <input type="text" id="username" required placeholder="daus"
                   class="w-full bg-white border border-slate-300 focus:border-[#3A7D44] focus:ring-1 focus:ring-[#3A7D44] rounded-xl pl-10 pr-4 py-3 text-slate-800 placeholder-slate-400 text-sm outline-none transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="bi bi-key-fill"></i>
            </span>
            <input type="password" id="password" required placeholder="••••••••"
                   class="w-full bg-white border border-slate-300 focus:border-[#3A7D44] focus:ring-1 focus:ring-[#3A7D44] rounded-xl pl-10 pr-4 py-3 text-slate-800 placeholder-slate-400 text-sm outline-none transition">
          </div>
        </div>

        <button type="submit" id="login-btn" class="w-full btn-green py-3.5 rounded-xl font-bold text-white text-sm flex items-center justify-center gap-2 shadow-lg hover:scale-[1.01] transition cursor-pointer">
          <span>MASUK PORTAL ADMIN</span>
          <i class="bi bi-box-arrow-in-right text-base"></i>
        </button>

      </form>

      <!-- Default Credential Notice -->
      <div class="mt-8 pt-6 border-t border-slate-200 text-center">
        <p class="text-[11px] text-slate-500">
          Default Credential: <span class="font-mono text-[#2F6B3A] font-bold"></span> / <span class="font-mono text-[#2F6B3A] font-bold"></span>
        </p>
        <a href="/" class="inline-block text-xs text-slate-500 hover:text-[#2F6B3A] mt-2 transition">
          ← Kembali ke Halaman Utama
        </a>
      </div>

    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const alertEl = document.getElementById('login-alert');
      const btn = document.getElementById('login-btn');

      alertEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `<i class="bi bi-arrow-repeat animate-spin text-lg"></i> <span>Memverifikasi...</span>`;

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = data.redirectUrl || '/views/admin/dashboard.html';
        } else {
          alertEl.textContent = data.message || 'Login gagal. Periksa username dan password.';
          alertEl.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = `<span>MASUK PORTAL ADMIN</span> <i class="bi bi-box-arrow-in-right text-base"></i>`;
        }
      } catch (err) {
        alertEl.textContent = 'Terjadi kesalahan sistem: ' + err.message;
        alertEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<span>MASUK PORTAL ADMIN</span> <i class="bi bi-box-arrow-in-right text-base"></i>`;
      }
    }
  </script>
</body>
</html>
